name: Release Packaging & Deployment

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  package-and-release:
    name: Package Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: sdlhana-windows-x64.zip
          - os: macos-latest
            artifact_name: sdlhana-macos-x64.tar.gz
          - os: ubuntu-latest
            artifact_name: sdlhana-linux-x64.tar.gz

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-14 \
          g++-14 \
          cmake \
          ninja-build \
          libasound2-dev \
          libpulse-dev \
          libwayland-dev \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxss-dev \
          libxcursor-dev \
          libxi-dev \
          libxdamage-dev \
          libxinerama-dev \
          libxtst-dev \
          libfreetype6-dev \
          libdbus-1-dev
        echo "CC=gcc-14" >> $GITHUB_ENV
        echo "CXX=g++-14" >> $GITHUB_ENV

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Executable
      run: cmake --build build --config Release --target sdlhana

    - name: Package Bundle (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path build/Release/* -DestinationPath ${{ matrix.artifact_name }}

    - name: Package Bundle (macOS)
      if: runner.os == 'macOS'
      run: |
        # Generate macOS icns icon set
        mkdir -p icon.iconset
        sips -z 16 16     src/images/cards.bmp --out icon.iconset/icon_16x16.png 2>/dev/null || true
        sips -z 32 32     src/images/cards.bmp --out icon.iconset/icon_16x16@2x.png 2>/dev/null || true
        sips -z 32 32     src/images/cards.bmp --out icon.iconset/icon_32x32.png 2>/dev/null || true
        sips -z 64 64     src/images/cards.bmp --out icon.iconset/icon_32x32@2x.png 2>/dev/null || true
        sips -z 128 128   src/images/cards.bmp --out icon.iconset/icon_128x128.png 2>/dev/null || true
        sips -z 256 256   src/images/cards.bmp --out icon.iconset/icon_128x128@2x.png 2>/dev/null || true
        sips -z 256 256   src/images/cards.bmp --out icon.iconset/icon_256x256.png 2>/dev/null || true
        sips -z 512 512   src/images/cards.bmp --out icon.iconset/icon_256x256@2x.png 2>/dev/null || true
        sips -z 512 512   src/images/cards.bmp --out icon.iconset/icon_512x512.png 2>/dev/null || true
        iconutil -c icns icon.iconset -o build/sdlhana.app/Contents/Resources/sdlhana.icns 2>/dev/null || true

        # Ensure Resources and MacOS directories contain all game assets and dynamic libraries
        mkdir -p build/sdlhana.app/Contents/Resources
        mkdir -p build/sdlhana.app/Contents/MacOS
        cp -r src/data build/sdlhana.app/Contents/Resources/
        cp -r src/fonts build/sdlhana.app/Contents/Resources/
        cp -r src/images build/sdlhana.app/Contents/Resources/
        cp -r src/sound build/sdlhana.app/Contents/Resources/
        cp -r src/data build/sdlhana.app/Contents/MacOS/
        cp -r src/fonts build/sdlhana.app/Contents/MacOS/
        cp -r src/images build/sdlhana.app/Contents/MacOS/
        cp -r src/sound build/sdlhana.app/Contents/MacOS/
        find build -name "*.dylib" -exec cp {} build/sdlhana.app/Contents/MacOS/ \; 2>/dev/null || true

        # Compress native sdlhana.app bundle
        tar -czvf ${{ matrix.artifact_name }} -C build sdlhana.app

    - name: Package Bundle (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p dist
        find build -type f -name "sdlhana" -exec cp {} dist/ \;
        cp -r src/data dist/
        cp -r src/fonts dist/
        cp -r src/images dist/
        cp -r src/sound dist/
        find build -name "*.so*" -exec cp {} dist/ \; 2>/dev/null || true
        tar -czvf ${{ matrix.artifact_name }} -C dist .

    - name: Upload Release Asset to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.artifact_name }}
